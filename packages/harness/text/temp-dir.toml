[tool]
label = "Temporary directories"
description = "Create, inventory, or release session-owned temporary directories."

[schema]
action = "create | inventory | release"
type = "(default) scratch: automatically removed on shutdown. retained: needs explicit release."
purpose = "Required short lowercase purpose name."
path = "Exact owned directory path returned by create or inventory. Required for release."
confirm_all_writers_stopped = "Required true for release. You confirm all writers, including detached processes and descendants, have exited and been waited for. Not checked by the tool."
inventory_complete = "Whether every directory record was checked successfully. False means the inventory may be partial or unknown."
directories = "Verified existing managed directories for this owner. Null means unreadable. An empty array proves none remain only when inventory_complete=true."
inventory_errors = "Errors that prevented directory records from being checked reliably."

[guidelines]
bullets = [
	"Use temp_dir tool instead of raw mktemp or /tmp cache roots.",
	"Use temp_dir.type=retained for unmanaged or detached work. Never give scratch paths to writers outside the harness's managed lifetime.",
	"temp_dir.action=inventory may include concurrent delegated work. Do not manually release another task's directory unless cleanup was delegated to you and all its writers joined.",
]

[results]
inventory = "{{json}}"
inventory_failed = "Temporary-directory inventory is incomplete: {{error}}"
owner_failed = "Could not capture temporary-directory owner. Inventory is incomplete: {{error}}"
aborted = "Temporary-directory operation was aborted. No new action started."
release_requires_writers = "Manual release requires an owned path and confirm_all_writers_stopped=true. Confirm every writer has exited and been waited for, including detached processes and descendants."
invalid_action = "Unknown action. Use create, inventory, or release."
