# Model-facing text for the wait_any tool.

[tool]
description = "Yield until an event wakes the agent."
prompt_snippet = "Yield control until an event wakes you"

[guidelines]
bullets = [
  "wait_any ends the turn until a user message, shell completion/error, alarm, or registered external event wakes you. Use it only for pending background shells, active alarms, or registered subscriptions; otherwise end your turn. Explicitly arm subscriptions with bounded expiry; wait_any creates none."
]
