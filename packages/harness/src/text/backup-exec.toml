# Model-facing text for the backup-exec tool (cpi dev-only fallback runner).

[tool]
description = "Execute an argv vector and return combined stdout and stderr, plus the exit code."
prompt_snippet = "Fallback argv runner — use only when sh is broken"

[schema]
command = "Argv vector to exec directly (no shell), e.g. [`make`, `test`] or [`bash`, `-c`, `ls -la`]. Omit or leave empty to default to [$SHELL]."
workdir = "Working directory; defaults to the current cwd."
timeout_ms = "Kill the process after this many milliseconds and return partial output (default 30000, max 120000)."

[guidelines]
bullets = [
  "Use backup-exec ONLY if sh malfunctions; otherwise use sh for linting, backgrounding, and completion notices.",
  "command executes argv without a shell: no pipes/globs/redirects/&&. For shell syntax, use [`bash`, `-c`, `...`] or [`$SHELL`, `-c`, `...`]. Set timeout_ms for possible hangs; timeout kills the process and returns partial output.",
]
