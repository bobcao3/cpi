# Model-facing text for the shell tools.

# ── Tool metadata shown to the main agent ──
[sh]
description = "Run a shell command; if still running after `waitfor`, background it and return a signalling id. Codemode returns structured results: check is_error/status, read the bounded output preview, and use full_output_path for complete output. Nonzero exits and blocked commands set is_error=true; execution exceptions reject."
prompt_snippet = "Run shell commands"

[sh_signal]
description = "Signal a background shell command by its sh-returned ID."
prompt_snippet = "Signal background shell commands"

[sh_background_ps]
description = "List active background shells and repeat_until monitors."
prompt_snippet = "List active background jobs"

[sh_detach]
description = "Detach a background shell to survive pi shutdown, like nohup/tmux. Output still drains to its log; Ghostmux retains the child's output pipe, avoiding SIGPIPE."
prompt_snippet = "Detach background shells to run untracked"

[schema.sh]
description = "Short description of what this command is doing (a few words)"
waitfor = "Seconds to wait before backgrounding (default {{max_waitfor}}, max {{max_waitfor}}; >{{max_waitfor}} errors)"
command = "Command to run"
env = "Dotenv merged into sh env; dotenv wins for command variables, while cpi session/runtime routing variables refresh from the current session"

is_pty = "Allocate a pseudoterminal for interactive terminal applications; default false preserves pipe semantics. Use ghostmux send-input for CLI input."

[schema.sh_signal]
id = "Background shell PID (as returned by sh)"
signal = "Signal name/number (default SIGINT; {{#windows}}on Windows, any signal request forcibly terminates the entire background process tree; POSIX signal names are treated as forced termination{{/windows}}{{^windows}}SIGKILL to terminate{{/windows}})"

[schema.sh_detach]
id = "Background shell PID (as returned by sh)"

[results.sh_signal]
windows_terminated = "Background {{id}} process tree terminated (requested {{signal}})."
posix_killed = "Background {{id}} terminated (SIGKILL)."
posix_sent = "Sent {{signal}} to {{id}}."

[results.sh]
aborted = "Aborted before start."

[completion]
repeat-breach = "Repeat monitor {{id}} breached on exit {{code}} (shell command time exceeded repeat interval)"
repeat-stopped = "Repeat monitor {{id}} stopped on exit {{code}}"
shell-complete = "Shell {{shell_label}} completed on exit {{code}}"
shell-failed = "Shell {{shell_label}} command failed on exit {{code}}"
summary = "{{base}}; log {{path}}{{#has_range}} lines {{start}}..{{end}}{{/has_range}}"

[shutdown]
summary = "Session shutdown interrupted background {{kind}} {{id}}{{#describe}} · {{describe}}{{/describe}}."
guidance = "cpi stopped tracking this background action during session shutdown and requested termination of any running command. The final exit status is unknown. Do not assume the command completed or stopped. Check the log and command side effects before restarting."

# ── promptGuidelines ──
[guidelines]
sh = [
  "Ghostmux is cpi's headless terminal manager. Like tmux, Ghostmux manages terminal sessions and supports sending input and capturing panes; Ghostmux also renders screenshots. Ghostmux uses its own CLI and protocol, not tmux's.",
  "Interactive terminals require is_pty=true. sh has no stdin parameter; send input with ghostmux send-input --uid UID --text TEXT.",
  "Shell results provide UID/socketPath; the environment provides CPI_GHOSTMUX_SOCKET and ghostmux on PATH. Always select the daemon explicitly: ghostmux -S SOCKET COMMAND.",
  "Read rendered text with ghostmux -S SOCKET capture-pane --uid UID --history --join; raw bytes with ghostmux -S SOCKET read-output --uid UID --offset N --limit N. Save live PTY screenshots with ghostmux -S SOCKET screenshot --uid UID --output PATH. Completed sessions lose terminal state; read their durable logs.",
  "Logs contain raw output, including escapes. Replay completed PTY logs: ghostmux --input LOG --text capture.txt --history --join --png screen.png; include --cols/--rows for nondefault geometry.",
  "Each sh call starts fresh `{{shell_invocation}}` ({{shell_name}}); no env/cwd/shell state persists between calls. Use `env-capture` to save an environment as dotenv for later sh calls.",
  "sh/sh_repeat_until require a brief purpose in `description`. sh rejects waitfor > {{max_waitfor}} seconds.",
  "Use sh_signal with the returned PID; SIGKILL terminates. Background completion notifies and returns control; if no follow-up is needed, end the turn.",
  "Avoid polling/busy waiting: never poll background shells with repeated alarms; completion notifies automatically. Prefer alarm for scheduled wake-ups over `sleep N && ...`.",
  "{{#fd}}Search files with the faster `$ fd` command not `$ find`: fd [OPTS] [-H] [-I] [pattern] [path]...{{/fd}}",
  "{{#rg}}Search content with the faster `$ rg` command not `$ grep`: rg [OPTS] [--hidden] [--no-ignore] PATTERN [path]...{{/rg}}",
  "sh edits trigger auto-lint when an LSP session is running.",
]
sh_signal = [
  "{{^windows}}sh_signal defaults to SIGINT and signals the whole process group. Never run shell `kill` on background PIDs; use sh_signal.{{/windows}}",
  "{{^windows}}SIGKILL terminates the group and suppresses completion notification; never wait_any expecting that notice. Other signals (SIGINT, SIGTERM, …) may be caught/ignored and need not stop the process; eventual exit still notifies, so wait_any until then.{{/windows}}",
  "{{#windows}}Every signal request forcibly terminates the entire background process tree and suppresses the completion notice.{{/windows}}",
  "{{#windows}}Windows does not provide POSIX signal delivery.{{/windows}}"
]
sh_detach = [
  "Detach removes the PID from sh_background_ps and sh_signal and prevents later completion notifications; the process keeps running.",
  "After backgrounding a service/web server that must outlive this session, use sh_detach.",
  "Never detach subagent launchers: only the RPC client detaches, not the root-owned Worker; root pi shutdown cancels the agent."
]
sh_background_ps = [
  "Use sh_background_ps to list running background shells and monitors.",
]
