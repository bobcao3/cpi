# Model-facing text for the set_cwd tool.

[reminder]
content = 'system reminder | Current cwd: {{cwd}}{{#reason}} ({{reason}}){{/reason}}'

[tool]
description = "Change the cwd for all subsequent tool calls or shell commands."
prompt_snippet = "Change the cwd for all subsequent tool calls or shell commands."

[schema]
path = "Target directory, absolute, or relative to cwd"

[guidelines]
bullets = [
  "Use set_cwd for project switches or a wrong shell root, instead of repeating `cd path/to/project && ...` in sh calls.",
]
