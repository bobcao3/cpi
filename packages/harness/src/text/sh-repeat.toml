# Model-facing text for the sh_repeat_until tool.

[tool]
description = "Run a shell command repeatedly. Each monitor runs in a detached process group and starts in the background."
prompt_snippet = "Poll with repeated shell commands"

[schema]
command = "Command to run repeatedly"
interval = "Seconds between repetitions (5-60)"
description = "Short description of what this monitor is doing (a few words)"
env = "Dotenv wins for command variables; cpi session/runtime routing variables remain current"

[guidelines]
bullets = [
  "Set interval to 5–60 seconds; an invocation exceeding it kills the loop with repeat-breach. Each invocation uses {{shell_invocation}} ({{shell_name}}).",
  "Repeat while exit code is 0; any nonzero exit stops and notifies with exit code, monitor log path, and last invocation's log line-range. Cancel with sh_signal SIGKILL on the rpt- ID.",
]
