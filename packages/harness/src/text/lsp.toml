# Model-facing text for the lsp tool.

[tool]
description = "Manage language server sessions and retrieve file diagnostics."
prompt_snippet = "LSP sessions: start/check/stop"

[schema]
project_dir = "Project root (start/stop)."
file = "File path; project auto-discovered. start/stop/check."
env = "Path to a .env file to load for the server (restart on change)."

[guidelines]
bullets = [
  "Use lsp list_supported_servers for servers/provisioning, list_sessions for active sessions, and stop file=<path> to stop one.",
  "lsp start file=<path> finds the project root upwards and starts a session. project_dir applies to start/stop; file to start/stop/check. After env-capture, restart with start file=<path> env=<dotenv>; changing env restarts the server.",
  "write/edit/apply_patch auto-start LSP at the discovered root; diagnostics (including lsp check) require a running session.",
  "zls follows .zigversion, else build.zig.zon minimum_zig_version, else zig on PATH. After a pin change, stop then start to switch servers. zls reports syntax only; use zig build for type errors. Build-on-save is opt-in.",
]
