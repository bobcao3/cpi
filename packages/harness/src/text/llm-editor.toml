# Text for the editor tool and its tool-less subagents.

# ── System prompts for the Viewer/Editor subagents ──
[system]
viewer = '''
You are an expert code analyzer. Your task is to identify line ranges in a file
that are relevant to a given query.

You will be given:
1. A file with numbered lines in the format: LINE_NUMBER|LINE_CONTENT
2. A query describing what the user is looking for

Consider function/method definitions, class definitions, variable declarations,
imports, comments, and any code blocks that implement functionality related to
the query.

OUTPUT: return only a JSON object with `one_line_summary` (single-line string
describing file content, not the query) and `ranges` (array of objects with
integer `start` and `end` inclusive, 1-indexed). No prose or Markdown fences.

Example: {"one_line_summary":"Defines authentication checks and token refresh","ranges":[{"start":10,"end":25},{"start":45,"end":60}]}

RULES:
1. `ranges` is a JSON array of {"start": start_line, "end": end_line} objects,
  1-indexed and inclusive.
2. Each range must include complete logical blocks (do not split functions/
  classes).
3. Include a few lines of context before and after each relevant section.
4. If nothing is relevant, call with `ranges = []` and summarize what the file contains.
5. Sort ranges by start line; merge overlapping or adjacent ranges.
6. Do not include entire files unless the query asks for everything.
7. Output exactly one JSON object and end your turn.

Example 1 - Finding a specific function:
Query: "Where is the calculate_total function defined?"
{"one_line_summary":"Defines calculate_total","ranges":[{"start":15,"end":28}]}

Example 2 - Finding multiple related sections:
Query: "How is user authentication handled?"
{"one_line_summary":"Implements authentication and sessions","ranges":[{"start":5,"end":8},{"start":23,"end":45},{"start":102,"end":130}]}

Example 3 - Nothing relevant found:
Query: "Where is the database connection configured?"
{"one_line_summary":"File defines application routes and middleware","ranges":[]}
'''
editor = '''
You are an expert code editor. Analyze the numbered file and return the
requested changes as one patch for the supplied file. Put the patch between
the opening and closing marker lines shown below. Output no prose or Markdown
fences:

{{open}}
@@
 exact context
-old text
+new text
{{close}}

1. Interpreting the instruction:

The file is the source of truth. If the instruction provides exact quoted text,
apply that exact change. Otherwise, its wording may be fuzzy; locate the
intended region in the file and work from what is actually there. Where the
instruction and file disagree, the file wins.

The file is shown with per-line prefix of `LINE_NUMBER|`, do not emit this into
the patch body.

When multiple edits satisfy the instruction, preserve unmentioned code and
choose the smallest faithful change.

If the instruction requires novel implementation that is not clearly specified,
cancel the edit by outputting exactly `*** EDIT CANCELED ***`.

2. Formatting the diff:

A patch is diff text describing changes to one existing file. A hunk consists
of one hunk header and the following context, removal, and addition lines up to
the next header or the end of the patch. Hunk numbers start at 1 in submission
order and include context-only hunks. Error line numbers count lines of patch
text, not source-file lines. For editor responses, patch text starts immediately
after the opening marker line.
- Unchanged context: prefix one space
- Removed lines: prefix one `-`
- Added lines: prefix one `+`

All hunks must use the original file as the source. Changed source regions
must not overlap; unchanged context may overlap between hunks.

Hunk headers:
- Line numbers and counts in numbered headers may be approximate. The tool
  first checks the stated source-line position. If the hunk does not match
  there, the tool searches for a unique matching location elsewhere in the
  allowed source lines.
- A bare `@@` header is also accepted.
- An exact-source-line header has the form `@@ exact source line`. The tool
  finds the named source line and searches for the hunk body after that line.
- A context-only hunk contains unchanged lines without additions or removals.
  The tool searches for later hunks after the matched context lines.

Hunk body:
- Include enough unchanged or removed source context to identify the intended
  location.
- At least one hunk must add or remove a line. Exact-source-line headers and
  unnumbered hunks must match uniquely within the remaining source lines.
  After a context-only hunk or exact-source-line header, keep subsequent hunks
  in source order.
- Use `\ No newline at end of file` only when changing final-newline state. Put
  every hunk after one {{open}} line and before one {{close}} line. Output
  nothing before the opening marker or after the closing marker.

---
'''

editor_fuzzy = '''
The tool can find matching hunks at different line numbers and tolerate some
indentation or trailing-whitespace differences. Still copy context and removal
lines accurately from the source file.
'''

[tasks]
viewer = '''
{{content}}

Query: {{query}}

Respond with only a JSON object containing `one_line_summary` and `ranges` relevant to the query.
'''
editor = '''
{{content}}

Instruction: {{instruction}}
'''
editor_correction = '''
{{failure}}
Use the original numbered file/instruction. Return only corrected hunks between
one {{open}} line and one {{close}} line.
'''
# ── Tool metadata shown to the main agent (one tool per command) ──
[tool.read]
description = "Read files and directories. Directory reads list a non-hidden 2-level tree. File reads without a query return plain text without line numbers."
prompt_snippet = "Read files/dirs (AI-filtered)"
guidelines = [
	"Prefer read for files/directories; use sh for git, builds, tests, searches, and process control.",
	"Use absolute paths for read/edit/write/apply_patch; read also accepts its declared path prefixes.",
	"Pass read.query for AI-filtered relevant ranges with line numbers instead of the whole file.",
	"{{#vision}}Use `read` tool to view an image file (jpg/png/gif/webp/avif) & show it to the user.{{/vision}}",
]

[tool.edit]
description = "Edit an existing file from a natural-language instruction. A hunk is a diff header plus context/removal/addition lines. Errors count hunks from 1 in submission order and cite patch-text lines, not source lines. Stop at the first failed hunk; editor.partialApply controls whether earlier hunks persist. Partial application ends the attempt and reports applied/failed/unattempted later hunks. Same-path edits serialize."
prompt_snippet = "Edit files via natural-language instruction"
guidelines = [
	"Name the function/class/method and concrete actions in edit.instruction; the subagent emits unified-diff hunks and refuses creative synthesis. Prefer 'In MyClass.my_method, change X to Y' over 'fix the bug'.",
	"Review the diff for instruction compliance and logical correctness; matching source is insufficient. edit cannot create files; use write.",
]

[tool.apply_patch]
description = """
Apply diff text to one existing file; never create, delete, or rename. A hunk is a header plus context/removal/addition lines. Count hunks from 1 in submission order, including context-only hunks; error lines refer to patch text, not source lines.
Headers: `@@`, `@@ exact source line`, or `@@ -OLD,COUNT +NEW,COUNT @@`. Prefix context with a space, removals with -, additions with +. A context-only hunk has no additions/removals; later hunks match after its unchanged lines. Exact-source headers select a source line; the body matches after it. Exact-source headers and unnumbered hunks require unique matches within remaining source lines. At least one hunk must change lines. Text after a numbered header's closing @@ does not select a location.
Stop at the first failed hunk. editor.partialApply controls whether earlier hunks persist; feedback identifies applied/failed/unattempted later hunks. After partial application, re-read and retry only remaining changes. Validate file headers, surrounding markers, and input-size limits before applying; validation failure leaves the file unchanged. Optional *** Begin Patch/*** End Patch markers or Markdown fences are accepted; file headers must name the path argument.
"""
prompt_snippet = "Apply single-file diff hunks directly"
guidelines = [
	"Use apply_patch for a known exact change with current source, or edit to delegate the change. After a mismatch, re-read; never guess context.",
]

[tool.write]
description = "Write a new file and create parent directories as needed."
prompt_snippet = "Write new files"
guidelines = [
	"write creates from file_text and fails if the path exists; use apply_patch/edit for existing files. Prefer write over sh heredocs: writes are atomic and share edit's per-path lock.",
]

# ── Schema field descriptions (injected into the TypeBox tool schemas) ──
[schema]
path = "Absolute path to a file or directory."
read_path = "Absolute path to a file or directory; $PI_AGENT_SRC/, $CPI_HARNESS_SRC/, and $HOME/ prefixes are also accepted."
query = "read: natural-language query for what to find; an LLM returns only the relevant line ranges with line numbers."
instruction = "edit: natural-language change description; name the function/class/method to change."
file_text = "write: full content of the new file."
patch = "Single-file unified-diff hunks against the original file. No wrapper or footer is needed."

# ── Short result/inline message strings ──
[messages]
view_no_ranges = "(no relevant ranges)"
empty_dir = "(empty)"
no_output = "(no output)"
head_more = "... ({{n}} more lines; pass a query to view relevant ranges)"
lines_omitted = "... ({{n}} lines omitted) ..."
image_read = "Read image file [{{mime}}]"
image_omitted = "Read image file [{{mime}}]\n[Image omitted: could not be resized below the inline image size limit.]"
image_unsupported = "Image file [{{mime}}]: {{path}}. The current model does not support images."
video_note = '''Video file [{{path}}]. pi has no native video content type, so it cannot be inlined. Extract frames via sh, e.g. `ffmpeg -i "{{path}}" -vf fps=1 frame_%03d.png`, then read the frames.'''

# ── LSP result-field strings (design §9; {{placeholder}} substituted via fmt) ──
[lsp]
diagnostics_none = "none"
install_failed = "run 'lsp start file={{path}}' to provision"
restart_hint = "LSP auto-started for {{root}}. If the env is wrong, run 'lsp start file={{path}} env=<dotenv>' to restart."

# ── Error message templates ({{placeholder}} substituted at runtime) ──
[errors]
aborted = "Canceled without writing."
not_found = "Not found: {{path}}"
not_a_file = "{{path}} is not a regular file."
file_too_large = "{{path}}: {{size}} bytes exceeds {{limit}}. Use sh for targeted reads/edits."
cannot_read = "Cannot read {{path}}: {{reason}}"
create_requires_text = "write requires file_text."
file_exists = "{{path}} already exists — use `apply_patch` or `edit` to modify it."
create_failed = "Could not create {{path}}: {{reason}}"
edit_requires_instruction = "edit requires an instruction."
no_editor_model = "Select a main-session model or configure an available editor.model with credentials."
invalid_chain_regex = "Editor skipped editor.chain rule {{i}}: invalid regular expression."
configured_unavailable = "{{model}} is unavailable or lacks credentials; editor.chain runs if a main-session model exists."
chain_zero_width = "Editor skipped editor.chain rule {{i}} because the pattern matched empty text."
chain_malformed_selector = "Editor skipped editor.chain rule {{i}}: \"{{selector}}\" needs nonempty provider/model names."
chain_no_match = "No editor.chain rule selected an available model with credentials; editor uses {{main}}."
provider_fallback = "Editor switched from {{requested}} to {{resolved}} due to availability or credentials."
viewer_timeout = "Viewer subagent timed out after {{ms}}ms. Consider fewer query statements & use concrete keywords."
editor_timeout = "Editor timed out ({{ms}} ms) without writing. Request fewer changes."
no_change = "The patch changes nothing; compare file and instruction."
editor_corrections_exhausted = "Editor exhausted {{turns}} correction attempts: {{failure}}"
editor_no_response = "No patch returned; file unchanged. Refine instruction or use apply_patch."
direct_output_overflow = "Response exceeds {{response_limit}} UTF-8 bytes; request less. File unchanged."
direct_too_large = "UTF-8 byte limits: response {{response_limit}}, patch {{patch_limit}}. Return less. File unchanged."
direct_missing_envelope = "Return exactly {{open}}, all hunks, then {{close}} as separate lines. File unchanged."
direct_multiple_envelopes = "Use one {{open}}/{{close}} pair around all hunks; remove duplicates. File unchanged."
direct_bad_envelope = "Reverse markers: {{open}}, hunks, {{close}}. File unchanged."
direct_outside_text = "Remove non-whitespace outside {{open}}/{{close}}, including prose or Markdown fences. File unchanged."
direct_empty_diff = "Put a changed hunk between {{open}}/{{close}}. File unchanged."
direct_editor_cancelled = "Editor declined; file unchanged. Clarify changes or use apply_patch."
viewer_truncated = "Viewer response exceeded the output-size limit. Re-run with a narrower query."
viewer_bad_output = "Viewer returned invalid JSON or invalid one_line_summary/ranges.\nOutput: {{tail}}"
write_failed = "Replacing {{path}} failed: {{reason}}. File unchanged."
subagent_start_failed = "Subagent failed: {{reason}}"
patch_rejected = "{{reason}} File unchanged."
hunk_failed = "Hunk {{hunk}} failed (patch {{patch}} line {{line}}): {{reason}}"
hunk_unchanged = "{{failure}} File unchanged; skipped hunks after {{hunk}}."
hunk_partial = "{{failure}} Applied hunks: {{applied}}; skipped hunks after {{hunk}}. Re-read; retry remaining changes with unchanged context or exact-source-line headers. Never repeat applied changes."
apply_bad_framing = "Patch {{patch}} line {{line}}: submit only one existing file's hunks, without prose or create/delete/rename operations."
apply_bad_target = "At patch {{patch}} line {{line}}, headers must name the path argument, exclude /dev/null, and pair --- with +++."
apply_no_diffs = "Submit a changed hunk."
apply_too_many = "Split requests exceeding {{hunk_limit}} hunks or {{hunk_limit}} patches."
apply_too_large = "Split the request. Limits: {{patch_byte_limit}} UTF-8 bytes and {{patch_line_limit}} lines per patch; {{total_byte_limit}} bytes total."
apply_bad_block = "Patch {{patch}} must be a nonempty diff string."
apply_bad_header = "Use @@ or @@ exact source line. Numbered values must be 0–{{coordinate_limit}}; nonzero counts require starts ≥1."
apply_no_changes = "Include additions/removals; hunks need body lines unless an exact-source-line header selects the location."
apply_bad_count = "The header counts absent source lines. Add context/removals or set the source count to 0."
apply_bad_newline = "Put `\\ No newline at end of file` only after an original or resulting file's final line without a newline."
apply_work_limit = "Comparison limit reached. Use accurate source-line numbers, specific context, or fewer hunks."
apply_bad_anchor = "Locate additions with a numbered header with source count 0, preceding context-only hunk, or exact-source-line header."
apply_not_found = "The hunk did not match. Copy complete source lines with indentation/line breaks; preserve source order."
apply_not_found_fuzzy = "The hunk did not match. Copy complete source lines with indentation/line breaks; preserve source order."
apply_ambiguous = "Multiple matches require more context or accurate numbered positions. Exact-source-line headers must uniquely match remaining source lines."
apply_overlap = "Hunk {{previous_hunk}} overlaps these edits or inserts at the same position. Merge or separate the edits."

[transcript]
title = "# {{role}} {{title}}"
section_system = "## System Prompt"
section_user = "## User"
section_completion = "## Completion"
section_completion_turn = "## Completion {{turn}}"
section_correction_turn = "## Correction {{turn}}"
section_stderr = "## stderr"
