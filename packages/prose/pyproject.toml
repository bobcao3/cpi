[project]
name = "cpi-prose"
version = "0.1.0"
description = "Local prose analysis daemon with scoped source comments and reference corpora"
requires-python = ">=3.14,<3.15"
dependencies = [
  "spacy>=3.8.16",
  "spacy-lookups-data>=1.0.5",
  "pyphen>=0.18.1",
  "numpy>=2.5.4",
  "preshed!=3.0.14",
  "huggingface-hub>=2.3.0",
  "en-core-web-sm",
  "torch>=2.14.1",
  "transformers[sentencepiece]>=5.20.2",
  "sentence-transformers>=6.2.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.14.1"]
cuda = ["torch>=2.14.1; sys_platform == 'linux'"]
apple = ["torch>=2.14.1; sys_platform == 'darwin'"]
mlx = ["mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpi_prose", "src/textdescriptives"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "apple" }]]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
extend = "../../ruff.toml"
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

