name: Install JJ
description: Install the pinned upstream JJ binary for Linux CI
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JJ_VERSION: v0.45.1
      run: |
        case "$RUNNER_ARCH" in
          X64)
            target=x86_64-unknown-linux-musl
            checksum=f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
            ;;
          ARM64)
            target=aarch64-unknown-linux-musl
            checksum=7349a43dd5a20dbc998b10114daa0ee63d2ab863fb822c7eb6b0ebca5903cc69
            ;;
          *) echo "Unsupported JJ runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/jj.tar.gz"
        curl --fail --location --retry 3 --max-time 120 \
          "https://github.com/jj-vcs/jj/releases/download/$JJ_VERSION/jj-$JJ_VERSION-$target.tar.gz" \
          --output "$archive"
        echo "$checksum  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/jj-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/jj-bin"
        "$RUNNER_TEMP/jj-bin/jj" --version
        echo "$RUNNER_TEMP/jj-bin" >> "$GITHUB_PATH"
