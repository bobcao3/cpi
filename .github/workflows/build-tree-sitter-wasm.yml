name: Build tree-sitter-wasm

on:
  push:
    branches: [main, master]
    paths:
      - "packages/tree-sitter-wasm/**"
      - ".github/workflows/build-tree-sitter-wasm.yml"
  pull_request:
    paths:
      - "packages/tree-sitter-wasm/**"
      - ".github/workflows/build-tree-sitter-wasm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build WASM
        working-directory: packages/tree-sitter-wasm
        run: zig build -Drelease=true
      - name: Smoke test
        run: |
          file packages/tree-sitter-wasm/zig-out/bin/tree-sitter-wasm.wasm
          file packages/tree-sitter-wasm/zig-out/bin/tree-sitter-wasm.wasm | grep -q "WebAssembly" || exit 1
          node packages/tree-sitter-wasm/scripts/tree-sitter-wasm.integration.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tree-sitter-wasm
          path: packages/tree-sitter-wasm/zig-out/bin/tree-sitter-wasm.wasm
          if-no-files-found: error
