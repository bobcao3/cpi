name: Installation

on:
  push:
    branches: ["**"]
    tags: ["cpi-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: ./.github/actions/setup-jj
      - name: Install terminal test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux zsh
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Fetch and verify signed native inputs
        run: node scripts/ci-native-artifacts.mjs "${{ runner.temp }}/native-inputs"
      - name: Test standalone npm and Bun tool installs
        env:
          GHOSTMUX_TEST_ARTIFACT: ${{ runner.temp }}/native-inputs
          CPI_TREE_SITTER_TEST_ARTIFACT: ${{ runner.temp }}/native-inputs
        run: |
          node packages/ghostmux/install.test.mjs
          node --test packages/tree-sitter-wasm/artifact.test.mjs
      - name: Build self-contained application
        env:
          GHOSTMUX_BIN: ${{ runner.temp }}/native-inputs/ghostmux-${{ matrix.platform }}
          CPI_TS_WASM: ${{ runner.temp }}/native-inputs/tree-sitter-wasm.wasm
        run: node packages/cli/scripts/package.mjs "${{ runner.temp }}/cpi-release"
      - name: Verify offline npm and Bun installs, SDK, workers, and live TUI
        run: node packages/cli/scripts/verify-installed.mjs "${{ runner.temp }}/cpi-release" --tui
      - uses: actions/upload-artifact@v4
        with:
          name: cpi-${{ matrix.platform }}-installation
          path: |
            ${{ runner.temp }}/cpi-release/*.tgz
            ${{ runner.temp }}/cpi-release/SHA256SUMS
            ${{ runner.temp }}/cpi-release/*manifest.json
            ${{ runner.temp }}/cpi-release/runtime-lock.json
            ${{ runner.temp }}/cpi-release/verification.json
          if-no-files-found: error
          retention-days: 14
