name: Registry installation

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish verified packages under @bobcao3 on npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.publish_npm }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Fetch and verify release-native inputs
        run:
          node scripts/ci-native-artifacts.mjs "${{ runner.temp }}/native" --all
      - name: Check source against the pinned installed SDK
        run: node scripts/check.mjs
      - name: Test release automation and editor regressions
        run: |
          node --test packages/cli/scripts/registry-release.test.mjs
          bun test --tsconfig-override tsconfig.json packages/harness/src/llm-editor/file-edit.test.ts packages/harness/src/llm-editor/partial-apply.test.ts
      - name: Prepare portable packages and platform-selected binaries
        env:
          CPI_RELEASE_TAG:
            ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run:
          node packages/cli/scripts/package-registry.mjs "${{ runner.temp
          }}/native" "${{ runner.temp }}/registry"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-packages
          path: |
            ${{ runner.temp }}/registry/*.tgz
            ${{ runner.temp }}/registry/*.json
            ${{ runner.temp }}/registry/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: registry-packages
          path: ${{ runner.temp }}/registry
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install by name with npm and Bun, with lifecycle scripts disabled
        run:
          node packages/cli/scripts/verify-registry.mjs "${{ runner.temp
          }}/registry"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-verification-${{ matrix.runner }}
          path: ${{ runner.temp }}/registry/registry-verification.json
          if-no-files-found: error
  publish:
    if:
      github.ref_type == 'tag' && (github.event_name == 'push' ||
      inputs.publish_npm)
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: registry-packages
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          pattern: registry-verification-*
          path: ${{ runner.temp }}/registry/verification
      - name: Publish dependencies before the CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          node packages/cli/scripts/publish-registry.mjs "${{ runner.temp
          }}/registry"
      - name: Verify installation from the public registry
        run:
          node packages/cli/scripts/verify-registry.mjs "${{ runner.temp
          }}/registry" --public
  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: registry-packages
          path: ${{ runner.temp }}/registry
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          node packages/cli/scripts/release-registry.mjs "${{ runner.temp
          }}/registry"
