name: Build ghostmux

on:
  push:
    branches: ["**"]
    paths:
      - "packages/ghostmux/**"
      - "packages/extensions/scripts/ghostmux*"
      - "packages/extensions/scripts/shell*"
      - "packages/extensions/scripts/shell/**"
      - "packages/extensions/extensions/shell*"
      - "packages/extensions/extensions/shell/**"
      - "packages/extensions/bin/host-pi.mjs"
      - ".github/workflows/*ghostmux.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/*/package.json"
      - "vendor/pi/**"
  pull_request:
    paths:
      - "packages/ghostmux/**"
      - "packages/extensions/scripts/ghostmux*"
      - "packages/extensions/scripts/shell*"
      - "packages/extensions/scripts/shell/**"
      - "packages/extensions/extensions/shell*"
      - "packages/extensions/extensions/shell/**"
      - "packages/extensions/bin/host-pi.mjs"
      - ".github/workflows/*ghostmux.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/*/package.json"
      - "vendor/pi/**"
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: echo "value=$(node packages/ghostmux/bin/ghostmux-release.mjs matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: platforms
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GHOSTMUX_BIN:
        ${{ github.workspace }}/packages/ghostmux/zig-out/bin/ghostmux${{
        startsWith(matrix.platform, 'win32-') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native executable
        id: compile
        working-directory: packages/ghostmux
        run:
          zig build --release=safe -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.baseline }} --verbose --summary all
      - name: Run native regression and integration tests
        working-directory: packages/ghostmux
        run: zig build test --release=safe -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.baseline }}
      - name: Verify static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          headers=$(readelf --program-headers "$GHOSTMUX_BIN")
          if grep -q INTERP <<< "$headers"; then
            echo "The Linux release must not require a dynamic loader." >&2
            exit 1
          fi
      - name: Exercise installed package without Pi peers or Zig
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: node packages/ghostmux/install.test.mjs
      - name: Exercise cpi shell and installed Pi integration
        shell: bash
        env:
          CPI_PI_HOST_ENTRY:
            ${{ github.workspace
            }}/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
        run: |
          node --experimental-transform-types packages/extensions/scripts/shell-native-lifecycle.integration.ts
          node --experimental-transform-types packages/extensions/scripts/shell-large-output.integration.ts
          node --experimental-transform-types packages/extensions/scripts/shell/test-cancellation.ts
          node packages/extensions/scripts/shell-install.integration.mjs
          node packages/extensions/scripts/ghostmux-vision.integration.test.mjs
      - name: Exercise Windows shell concurrency and process trees
        if: runner.os == 'Windows'
        run:
          node --experimental-transform-types
          packages/extensions/scripts/shell/test-windows.ts
      - name: Stage binary and provenance
        shell: bash
        run: |
          binary=packages/ghostmux/zig-out/bin/ghostmux
          if [[ '${{ matrix.platform }}' == win32-* ]]; then binary="$binary.exe"; fi
          node packages/ghostmux/bin/ghostmux-release.mjs stage "$binary" dist '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ghostmux-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
