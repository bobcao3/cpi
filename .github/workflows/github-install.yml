name: GitHub source installation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install the repository with npm and Bun, without lifecycle scripts
        env:
          SOURCE_REPOSITORY:
            ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          SOURCE_REVISION:
            ${{ github.event.pull_request.head.sha || github.sha }}
        run:
          node scripts/verify-github.mjs
          "github:$SOURCE_REPOSITORY#$SOURCE_REVISION"
