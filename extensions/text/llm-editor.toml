# All textual content for the editor tool and its tool-less subagents.
# Layered, last-wins (project > user > shipped default), matching cpi's config
# convention:
#   extensions/llm-editor/text.toml             (shipped defaults)
#   ~/.pi/agent/cpi-editor-text.toml            (user, all projects)
#   <cwd>/.pi/cpi-editor-text.toml              (project, overrides user)
#
# Format is TOML, parsed by `smol-toml` (0 deps, BSD-3). Multi-line literal
# strings ('''...''') preserve the exact text the model sees (no escape
# processing, so `\t` stays literal); basic strings ("...") interpret \n. A
# newline right after the opening ''' is trimmed, so content starts on the next
# line. Templates use {{placeholder}} tokens substituted at runtime.

# ── System prompts for the Viewer/Editor subagents (near-verbatim SWE-Edit) ──
[system]
viewer = '''
You are an expert code analyzer. Your task is to identify line ranges in a file
that are relevant to a given query.

You will be given:
1. A file with numbered lines in the format: LINE_NUMBER|LINE_CONTENT
2. A query describing what the user is looking for

Consider function/method definitions, class definitions, variable declarations,
imports, comments, and any code blocks that implement functionality related to
the query.

OUTPUT: call the `view-complete` tool with `ranges` = a JSON array of line
ranges. Each range is {"start": start_line, "end": end_line} (inclusive,
1-indexed). Do not print the ranges as text.

Example: view-complete({ ranges: [{"start": 10, "end": 25}, {"start": 45,
  "end": 60}, {"start": 100, "end": 115}] })

RULES:
1. `ranges` is a JSON array of {"start": start_line, "end": end_line} objects,
  1-indexed and inclusive.
2. Each range must include complete logical blocks (do not split functions/
  classes).
3. Include a few lines of context before and after each relevant section.
4. If nothing is relevant, call with `ranges = []`.
5. Sort ranges by start line; merge overlapping or adjacent ranges.
6. Do not include entire files unless the query asks for everything.
7. Call `view-complete` exactly once; this ends your turn.

Example 1 - Finding a specific function:
Query: "Where is the calculate_total function defined?"
view-complete({ ranges: [{"start": 15, "end": 28}] })

Example 2 - Finding multiple related sections:
Query: "How is user authentication handled?"
view-complete({ ranges: [{"start": 5, "end": 8}, {"start": 23, "end": 45},
  {"start": 102, "end": 130}] })

Example 3 - Nothing relevant found:
Query: "Where is the database connection configured?"
view-complete({ ranges: [] })
'''
editor = '''
You are an expert code editor. Analyze the numbered file and return the
requested changes by calling `edit-complete` with a `diffs` array.

The file is the source of truth. If the instruction provides exact quoted text,
apply that exact change. Otherwise, its wording may be fuzzy; locate the
intended region in the file and work from what is actually there. Where the
instruction and file disagree, the file wins.

When multiple edits satisfy the instruction, preserve unmentioned code and
choose the smallest faithful change.

Only edit when the requested result is determined by the instruction and file.
If it requires inventing or choosing novel implementation details that they do
not specify, call edit-complete with only cancel=true instead of designing the
implementation.

Context and removed rows are how the applier locates the region, so they work
best copied character-for-character from the numbered file, one diff row per
file line: same words, same punctuation, same line breaks, same indentation. It
is worth resisting the urge to improve a line while copying it. Correcting its
grammar, re-wrapping it, merging or splitting lines, or leaving a space after
the diff prefix all produce a row that matches nothing in the file, and the
patch is then rejected. Added rows are yours to write freely — only the rows
that describe existing content need to be exact.

Two ways to answer, and choosing well matters more than diff craftsmanship:

- `diffs` — unified-diff hunks. The default. Cheap, reviewable, and right for a
change that touches a few lines you can reproduce exactly.
- `content` — the complete new file, start to finish. Nothing is matched against
the original, so nothing can fail to match.

Reach for `content` whenever a diff would be awkward or risky: re-wrapping or
restructuring a hard-wrapped paragraph, re-indenting a block, a change touching
many scattered lines, a region whose lines are long prose you would have to
reproduce word-perfectly, or any moment where you find yourself unsure whether
your context rows match the file exactly. Formatting the result is your job, and
`content` is how you do it without fighting the diff format. Send the whole
file, changed and unchanged parts alike. Keep it semantically identical outside
the requested change, while freely re-wrapping or re-indenting neighbouring text
so the file's formatting conventions stay consistent.

If you do stay with `diffs` for a rewrap, remove all of the paragraph's lines
with `-` exactly as they appear, then add the replacement lines with `+`.
Adjusting line breaks inside context rows to fit the new text is what makes such
edits fail.

Hunk format — each array element holds one hunk (several in one element are
accepted, though one per element reads better):
- Open with `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@`. Give every hunk
  its own header with real coordinates; a bare `@@` separator leaves the applier
  guessing the location from content alone.
- Prefix unchanged context with one space, removed lines with `-`, added lines
  with `+`. A blank context line is a single space, not an empty string.
- Leave out file headers, Markdown fences, prose, and timestamps.
- OLD_START refers to the 1-indexed annotations in the supplied file. The
  annotations are not file content, so the `LINE_NUMBER|` prefix never
  belongs in a diff body.
- The body is authoritative: counts are recomputed from your rows, so an
  off-by-one count is harmless. Spend the attention on OLD_START and on the rows
  themselves.
- Give each hunk at least one `+` or `-` row, plus enough unchanged context to
  pin down where it goes.
- Context and removed rows refer to the original supplied file, not to the
  result of an earlier hunk.
- Put separated changes in separate array elements, and keep them from
  overlapping.
- To add or remove the final newline, place `\ No newline at end of file`
  immediately after the affected final source or target row, per standard
  unified-diff syntax.
- To insert into an empty file, use `@@ -0,0 +1,N @@`. In a non-empty file,
  prefer anchoring an insertion with context.
- Call `edit-complete` exactly once, with either `diffs` or `content`, never
  both. Omit `cancel` or set it false to apply; call with only `cancel: true`
  to abort. Do not print the result as text.

Example 1 - replace one line with two lines:
edit-complete({ diffs: [
  "@@ -10,1 +10,2 @@\n-return n\n+log(n)\n+return n"
] })

Example 2 - two separated hunks:
edit-complete({ diffs: [
  "@@ -1,1 +1,2 @@\n import os\n+import sys",
  "@@ -20,2 +20,2 @@\n def main():\n-    pass\n+    greet()"
] })
'''

editor_direct = '''
You are an expert code editor. Analyze the numbered file and return the
requested changes as one direct unified-diff envelope. Output only this format,
with one or more hunks inside and no prose, Markdown fences, or tool call:

{{open}}
@@
 exact context
-old text
+new text
{{close}}

1. Interpreting the instruction:

The file is the source of truth. If the instruction provides exact quoted text,
apply that exact change. Otherwise, its wording may be fuzzy; locate the
intended region in the file and work from what is actually there. Where the
instruction and file disagree, the file wins.

The file is shown with per-line prefix of `LINE_NUMBER|`, do not emit this into
the patch body.

When multiple edits satisfy the instruction, preserve unmentioned code and
choose the smallest faithful change.

If the instruction requires novel implementation that is not clearly specified,
cancel the edit by outputting exactly `*** EDIT CANCELED ***`.

2. Formatting the diff:

We use the `udiff` format.
- Unchanged context: prefix one space
- Removed lines: prefix one `-`
- Added lines: prefix one `+`

All hunks refer to the original file and must not overlap.

Hunk headers:
- Hunk coordinates and counts may be approximate; the applier uses the hunk body
  as the source of truth and can relocate a uniquely matching hunk.
- A bare `@@` header is also accepted.

Hunk body:
- Include enough unchanged or removed source context to identify the intended
  location.
- Use `\ No newline at end of file` only when changing final-newline state. Put
  every hunk inside the single {{open}} / {{close}} envelope and output nothing
  outside it.

---
'''

editor_direct_retry = '''
Your previous direct diff failed to apply. Return a corrected unified diff in
the same `{{open}}` / `{{close}}` envelope. Re-read the unchanged numbered file
and use the failure message to correct the hunk.
'''

editor_rewrite = '''

THIS ATTEMPT MUST USE THE REWRITE MODE.

Your previous patch was rejected, so the diff path has already been tried and
failed. Do not send `diffs` again. Call `edit-complete` with `content` holding
the complete new file, first line to last. Nothing is matched against the
original in this mode, so whatever the earlier hunk could not
express — a re-wrap, a re-indent, a line you could not reproduce character-for-
character — is no longer an obstacle.

Apply the requested change, and keep the rest of the file semantically
identical: no content added, removed, or reworded beyond what was asked.
Formatting is yours to manage. Re-wrapping a neighbouring paragraph or
re-indenting a nearby block to keep the file's own conventions consistent is
expected and welcome — that judgement is why this work goes to a model rather
than a patch program.

Include the entire file; content is written verbatim, so anything you leave out
is lost.
'''

editor_fuzzy = '''
The applier can relocate a uniquely matching hunk and tolerate small whitespace
drift; source rows should otherwise follow the file.
'''

[tasks]
viewer = '''
{{content}}

Query: {{query}}
'''
editor_retry = '''
Failure: {{failure}}

{{content}}

Instruction: {{instruction}}
'''
editor = '''
{{content}}

Instruction: {{instruction}}
'''
editor_direct = '''
{{content}}

Instruction: {{instruction}}
'''
editor_direct_retry = '''
Failure: {{failure}}

{{content}}

Instruction: {{instruction}}
'''
# ── Tool metadata shown to the main agent (one tool per command) ──
[tool.read]
description = "Read files and directories. On a directory, lists a non-hidden 2-level tree. On a file with a query, a Viewer subagent returns only the relevant line ranges (AI-filtered) with line numbers; without a query, a plain full-file read (no line numbers). Prefer this over sh for reading."
prompt_snippet = "Read files/dirs (AI-filtered)"
guidelines = [
	"`read` is for file and directory reads; prefer it over sh for reading (use sh for git, build, test, search, process control).",
	"`read`: pass `query` to receive only the relevant line ranges (AI-filtered, with line numbers) instead of the whole file — less context, less noise.",
	"{{#vision}}`read` on an image file (jpg/png/gif/webp) shows the image to the agent, never cat/sed/base64 images.{{/vision}}",
]

[tool.edit]
description = "Edit an existing file via a natural-language instruction. An Editor subagent emits bounded single-file unified-diff hunks which the tool matches and applies in-house, atomically and with a whitespace-fuzzy fallback. Race-free per-path: concurrent same-path edits serialize."
prompt_snippet = "Edit files via natural-language instruction"
guidelines = [
	"`edit` takes a natural-language `instruction` naming the function/class/method to change; the subagent emits unified-diff hunks. Be specific: 'In MyClass.my_method, change X to Y' beats 'fix the bug'.",
	"`edit`: decompose edit tasks into concrete actions, editor subagent will refuse creative synthesis work",
	"`edit` subagent guarantees clean formatting but does not guarantee logicical correctness, you are responsible for logically correct instructions.",
	"`edit` cannot create a new file; use `write` for that.",
]

[tool.write]
description = "Write a new file. Fails if the path already exists (use edit to modify an existing file). Creates parent directories as needed."
prompt_snippet = "Write new files"
guidelines = [
	"`write` writes a new file from `file_text`; it fails if the path already exists — use `edit` to modify an existing file.",
	"`write` is preferred over `sh` heredocs for new files; it is atomic and shares `edit`'s per-path locking.",
]

# ── Schema field descriptions (injected into the TypeBox tool schemas) ──
[schema]
path = "Absolute path to a file or directory."
query = "read: natural-language query for what to find; an LLM returns only the relevant line ranges with line numbers."
instruction = "edit: natural-language change description; name the function/class/method to change."
file_text = "write: full content of the new file."

# ── Short result/inline message strings ──
[messages]
view_no_ranges = "(no relevant ranges)"
empty_dir = "(empty)"
no_output = "(no output)"
head_more = "... ({{n}} more lines; pass a query to view relevant ranges)"
lines_omitted = "... ({{n}} lines omitted) ..."

# ── LSP result-field strings (design §9; {{placeholder}} substituted via fmt) ──
[lsp]
diagnostics_none = "none"
install_failed = "run 'lsp start file={{path}}' to provision"
restart_hint = "LSP auto-started for {{root}}. If the env is wrong, run 'lsp start file={{path}} env=<dotenv>' to restart."

# ── Error message templates ({{placeholder}} substituted at runtime) ──
[errors]
aborted = "Aborted before start."
not_found = "Not found: {{path}}"
not_a_file = "Not a file: {{path}}"
file_too_large = "{{path}} is {{size}}B (limit {{limit}}B) — too large to load. Use sh: `rg` to locate, `sed -n 'M,Np'` to read a range."
cannot_read = "Cannot read {{path}}: {{reason}}"
create_requires_text = "write requires file_text."
file_exists = "{{path}} already exists — use `edit` to modify it."
create_failed = "Could not create {{path}}: {{reason}}"
edit_requires_instruction = "edit requires an instruction."
no_editor_model = "editor: no editor model (no editor config and no main model)."
invalid_chain_regex = '[editor] chain rule {{i}}: invalid regex "{{pattern}}"; skipping.'
configured_unavailable = '[editor] configured editor.model "{{model}}" not available/authed; falling back to chain.'
viewer_timeout = "Viewer subagent timed out after {{ms}}ms. Consider fewer query statements & use concrete keywords."
editor_timeout = "Editor subagent timed out after {{ms}}ms. Consider reducing scope & increase specificity."
editor_cancelled = "Editor subagent cancelled the edit (edit-complete cancel=true)."
rewrite_empty = "edit-complete returned empty `content` for a non-empty file. Send the complete new file, or use `diffs` for a targeted change."
no_change = "The edit produced no change to the file. Re-check the instruction against the actual file content."
editor_truncated = "Editor subagent never called edit-complete (output truncated). Re-run the edit."
direct_output_overflow = "Editor direct output exceeded the bounded response-size limit."
direct_too_large = "The direct diff exceeds the bounded patch-size limit."
direct_missing_envelope = "Direct output must contain one `{{open}}` / `{{close}}` envelope."
direct_multiple_envelopes = "Direct output contains more than one DIFF envelope."
direct_bad_envelope = "The direct DIFF envelope markers are out of order."
direct_outside_text = "Direct output contains text outside the DIFF envelope."
direct_empty_diff = "The direct DIFF envelope is empty."
direct_editor_cancelled = "Editor cancelled: the instruction requires open-ended implementation choices. Use write or provide an exact replacement."
viewer_truncated = "Viewer subagent never called view-complete (output truncated). Re-run the read."
viewer_bad_output = "view-complete returned malformed ranges (not a JSON array of {start, end} objects).\nOutput: {{tail}}"
write_failed = "Could not write {{path}}: {{reason}}"
spawn_not_found = "pi binary not found on PATH: {{reason}}"
apply_no_diffs = "edit-complete was called without any diff hunks."
apply_too_many = "Diff block {{i}} exceeds the bounded hunk-count limit."
apply_too_large = "Diff block {{i}} exceeds the bounded patch-size limit."
apply_bad_block = "Diff block {{i}} is not a non-empty unified-diff string."
apply_bad_header = "Diff block {{i}} has no `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@` header."
apply_no_changes = "edit-complete was called with no added or removed lines — every hunk was pure context."
apply_bad_count = "Diff block {{i}}: header counts are only used to bound a `...` elision or to declare an insertion. Either give OLD_COUNT as the full elided source span (larger than the explicit source lines you listed), or include the context lines the header claims."
apply_bad_newline = "Diff block {{i}} has an invalid `No newline at end of file` marker or EOF location."
apply_work_limit = "Diff block {{i}} exceeded the bounded matching-work limit. Add accurate line coordinates and more specific context."
apply_bad_anchor = "Diff block {{i}} is a pure insertion whose `@@` header has no usable OLD_START, so there is nowhere to place it. Give real header coordinates, or include a context line to insert next to."
apply_not_found = "Diff block {{i}} does not match the file at its line anchor or at one unambiguous exact relocation. Re-read the numbered file and copy its context and removed rows exactly."
apply_not_found_fuzzy = "Diff block {{i}} matched nothing in the file, exactly or with the whitespace-fuzzy fallback. Its context or removed rows differ from the real file lines — re-read the numbered file and copy them exactly rather than from the instruction."
apply_ambiguous = "Diff block {{i}} has multiple possible application locations. Add context or correct its line header."
apply_overlap = "Diff block {{i}} conflicts with diff block {{j}}. Separate or merge the changed regions."

# ── Transcript (persisted subagent log) labels ──
[transcript]
title = "# editor {{role}} subagent"
section_system = "## System Prompt"
section_user = "## User"
section_completion = "## Completion"
section_stderr = "## stderr"

# ── Completion tools for the Viewer/Editor subagents (registered by
#    extensions/llm-editor/completion.ts in the child, role-gated by
#    PI_SUBAGENT_ROLE). edit-complete hands bounded unified-diff hunks to the
#    parent, which parses, matches, and applies all hunks with cpi's in-house
#    atomic engine. Plain text (no HTML escaping). ──
[completion.view_complete]
description = "Return the relevant line ranges from the file and end your turn. Call this exactly once with `ranges` = a JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed). Do not print the ranges as text."
prompt_snippet = "Return relevant line ranges"
guidelines = [
	"Output ONLY by calling this tool — never print the ranges as text.",
	"`ranges` is a JSON array of objects, each with numeric `start` and `end` fields, 1-indexed and inclusive.",
	"Each range must include complete logical blocks with a few lines of context before and after.",
	"Sort ranges by start line; merge overlapping or adjacent ranges.",
	"If nothing is relevant, call with `ranges = []`.",
	"Call this tool exactly once; this ends your turn.",
]

[completion.edit_complete]
description = "Return the edit and end your turn, either as unified-diff hunks in `diffs` or as the complete rewritten file in `content`. Prefer `content` whenever a diff would need re-wrapped, re-indented, or hard-to-reproduce context rows — it is matched against nothing and cannot fail to apply. Set cancel=true to abort without applying anything."
prompt_snippet = "Return file edits as unified-diff hunks or a full rewrite"
guidelines = [
	"Each `diffs` element starts with `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@`; prefer one hunk per element.",
	"Prefix context with one space (blank context lines too), removals with `-`, and additions with `+`; do not include file headers, fences, or prose.",
	"Header counts are recomputed from the body for a normal hunk; only an elided (`...`) hunk needs OLD_COUNT to state its full source span.",
	"Line-number annotations identify OLD_START but are not file content. Never copy the annotation prefix into hunk lines.",
	"All context/removal rows refer to the original supplied file. Use separate array elements for separated, non-overlapping changes.",
	"The instruction may quote the file approximately; copy context and removed rows from the numbered file itself, character-for-character, one row per file line.",
	"To rewrap a paragraph, remove all of its lines verbatim with `-` and add the new ones with `+`, rather than re-wrapping context rows.",
	"Use the standard `\\ No newline at end of file` marker only to change final-newline state.",
	"Set cancel=true and omit `diffs` to abort without applying anything. Otherwise leave `cancel` unset.",
	"Alternatively pass `content` with the complete new file instead of `diffs`; nothing is matched, so re-wrapping, re-indenting, and large restructurings cannot fail. Prefer it whenever exact context rows would be hard to reproduce.",
	"Pass either `diffs` or `content`, never both. Call this tool exactly once; this ends your turn. Do not print the result as text.",
]

[completion.schema]
ranges = "JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed), relevant to the query."
range_start = "Start line of this range, 1-indexed and inclusive."
range_end = "End line of this range, 1-indexed and inclusive."
diffs = "One or more bounded single-file unified-diff hunks. Each array element contains exactly one hunk against the original supplied file. Required unless cancel is true."
diff = "One unified-diff hunk beginning with an `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@` header, followed by space/plus/minus-prefixed body lines."
content = "The complete rewritten file, start to finish, replacing it wholesale. Nothing is matched against the original, so this is the reliable choice when a diff would need re-wrapped or hard-to-reproduce context rows. Mutually exclusive with diffs."
cancel = "Set to true to abort the edit without applying anything. Defaults to false."
