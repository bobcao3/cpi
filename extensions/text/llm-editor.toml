# All textual content for the editor tool and its tool-less subagents.
# Layered, last-wins (project > user > shipped default), matching cpi's config
# convention:
#   extensions/llm-editor/text.toml             (shipped defaults)
#   ~/.pi/agent/cpi-editor-text.toml            (user, all projects)
#   <cwd>/.pi/cpi-editor-text.toml              (project, overrides user)
#
# Format is TOML, parsed by `smol-toml` (0 deps, BSD-3). Multi-line literal
# strings ('''...''') preserve the exact text the model sees (no escape
# processing, so `\t` stays literal); basic strings ("...") interpret \n. A
# newline right after the opening ''' is trimmed, so content starts on the next
# line. Templates use {{placeholder}} tokens substituted at runtime.

# ── System prompts for the Viewer/Editor subagents (near-verbatim SWE-Edit) ──
[system]
viewer = '''
You are an expert code analyzer. Your task is to identify line ranges in a file that are relevant to a given query.

You will be given:
1. A file with numbered lines in the format: LINE_NUMBER<TAB>LINE_CONTENT
2. A query describing what the user is looking for

Consider function/method definitions, class definitions, variable declarations, imports, comments, and any code blocks that implement functionality related to the query.

OUTPUT: call the `view-complete` tool with `ranges` = a JSON array of line ranges. Each range is {"start": start_line, "end": end_line} (inclusive, 1-indexed). Do not print the ranges as text.

Example: view-complete({ ranges: [{"start": 10, "end": 25}, {"start": 45, "end": 60}, {"start": 100, "end": 115}] })

RULES:
1. `ranges` is a JSON array of {"start": start_line, "end": end_line} objects, 1-indexed and inclusive.
2. Each range must include complete logical blocks (do not split functions/classes).
3. Include a few lines of context before and after each relevant section.
4. If nothing is relevant, call with `ranges = []`.
5. Sort ranges by start line; merge overlapping or adjacent ranges.
6. Do not include entire files unless the query asks for everything.
7. Call `view-complete` exactly once; this ends your turn.

Example 1 - Finding a specific function:
Query: "Where is the calculate_total function defined?"
view-complete({ ranges: [{"start": 15, "end": 28}] })

Example 2 - Finding multiple related sections:
Query: "How is user authentication handled?"
view-complete({ ranges: [{"start": 5, "end": 8}, {"start": 23, "end": 45}, {"start": 102, "end": 130}] })

Example 3 - Nothing relevant found:
Query: "Where is the database connection configured?"
view-complete({ ranges: [] })
'''
editor = '''
You are an expert code editor. Your task is to analyze a file and make modifications according to the provided instructions.

Return your changes by calling the `edit-complete` tool with an `edits` array. Each edit is an exact text replacement: `oldText` (exact text from the original file to find) and `newText` (the replacement). You may include multiple edits in one call.

IMPORTANT RULES:
1. Each edit's `oldText` must match the original file content EXACTLY, including whitespace and indentation.
2. You may include multiple edits as multiple entries in the `edits` array.
3. If an edit's `oldText` is empty (""), it means REWRITE THE ENTIRE FILE with that edit's `newText` as the new full content. Use at most one such edit, and not together with others.
4. Each edit's `oldText` must be unique in the file; if there are multiple matches, include more surrounding context.
5. `oldText` values are matched against the original file, not after earlier edits. Do not emit overlapping or nested edits; merge nearby changes into one edit.
6. Keep each `oldText` as small as possible while still being unique.
7. Call `edit-complete` exactly once with your `edits` (omit `cancel` or set it false to apply; set `cancel: true` to abort without applying). Calling the tool ends your turn; not calling it is treated as an incomplete/truncated edit. Do not print the edits as text.

Example 1 - Modifying specific lines:
edit-complete({ edits: [
  { oldText: "def calculate_total(items):
    return sum(items)",
    newText: "def calculate_total(items):
    if not items:
        return 0
    return sum(items)" }
] })

Example 2 - Multiple edits in one call:
edit-complete({ edits: [
  { oldText: "import os", newText: "import os
import sys" },
  { oldText: "def main():
    pass", newText: "def main():
    greet()" }
] })

Example 3 - Rewriting the entire file (empty oldText):
edit-complete({ edits: [
  { oldText: "", newText: "#!/usr/bin/env python3
def new_function():
    pass" }
] })
'''
editor_fuzzy = '''
ADDITIONAL CAPABILITIES (fuzzy matching is enabled for this edit):

You MAY put `...` on its own line inside an edit's `oldText` to elide unchanged code that sits BETWEEN two regions you are editing within the same `oldText`. This lets you skip restating long unchanged spans. Rules:
- Put `...` alone on a line (optional leading whitespace) where code was omitted.
- The number of `...` lines MUST match between `oldText` and `newText`.
- Each non-`...` chunk must appear EXACTLY ONCE in the file.
- `...` means "leave this region unchanged"; it is not a wildcard — the surrounding chunks must still match the file exactly.
- Uniqueness rule still applies.

Example — edit the first and last lines of a long function, omitting the unchanged middle:
edit-complete({ edits: [
  { oldText: "def f(x):
    a = setup(x)
...
    return result",
    newText: "def f(x):
    a = setup(x, verbose=True)
...
    return result" }
] })

Additionally, matching tolerates a UNIFORM leading-whitespace offset between `oldText` and the file (you may omit indentation that is consistent across the whole edit); `newText` is re-indented to the file's level. Prefer exact matches; use these only when an exact `oldText` would be impractical.
'''
[tasks]
viewer = "Here is the file with numbered lines:\n\n{{content}}\n\nQuery: {{query}}"
editor = "Here is the current file content:\n```\n{{content}}\n```\n\nInstruction: {{instruction}}\n\nPlease call edit-complete with the edits needed to make these changes."

# ── Tool metadata shown to the main agent (one tool per command) ──
[tool.read]
description = "Read files and directories. On a directory, lists a non-hidden 2-level tree. On a file with a query, a Viewer subagent returns only the relevant line ranges (AI-filtered) with line numbers; without a query, a plain full-file read (no line numbers). Prefer this over sh for reading."
prompt_snippet = "Read files/dirs (AI-filtered)"
guidelines = [
	"`read` is for file and directory reads; prefer it over sh for reading (use sh for git, build, test, search, process control).",
	"`read`: pass `query` to receive only the relevant line ranges (AI-filtered, with line numbers) instead of the whole file — less context, less noise.",
	"{{#vision}}`read` on an image file (jpg/png/gif/webp) shows the image to the agent, never cat/sed/base64 images.{{/vision}}",
]

[tool.edit]
description = "Edit an existing file via a natural-language instruction. An Editor subagent emits exact search-replace blocks which the tool applies atomically (unique, exact, with a fuzzy fallback) and writes. Race-free per-path: concurrent same-path edits serialize."
prompt_snippet = "Edit files via natural-language instruction"
guidelines = [
	"`edit` takes a natural-language `instruction` naming the function/class/method to change; the subagent emits exact search-replace blocks. Be specific: 'In MyClass.my_method, change X to Y' beats 'fix the bug'.",
	"`edit`: if the instruction requires synthesizing novel logic the subagent cannot derive deterministically from the file, do not use `edit` — use `write` (you author file_text) or decompose into discrete deterministic edits.",
	"`edit` cannot create a new file; use `write` for that.",
]

[tool.write]
description = "Write a new file. Fails if the path already exists (use edit to modify an existing file). Creates parent directories as needed."
prompt_snippet = "Write new files"
guidelines = [
	"`write` writes a new file from `file_text`; it fails if the path already exists — use `edit` to modify an existing file.",
	"`write` is preferred over `sh` heredocs for new files; it is atomic and shares `edit`'s per-path locking.",
]

# ── Schema field descriptions (injected into the TypeBox tool schemas) ──
[schema]
path = "Absolute path to a file or directory."
query = "read: natural-language query for what to find; an LLM returns only the relevant line ranges with line numbers."
instruction = "edit: natural-language change description; name the function/class/method to change."
file_text = "write: full content of the new file."

# ── Short result/inline message strings ──
[messages]
view_no_ranges = "(no relevant ranges)"
empty_dir = "(empty)"
no_output = "(no output)"
head_more = "... ({{n}} more lines; pass a query to view relevant ranges)"
lines_omitted = "... ({{n}} lines omitted) ..."

# ── LSP result-field strings (design §9; {{placeholder}} substituted via fmt) ──
[lsp]
diagnostics_none = "none"
install_failed = "run 'lsp start file={{path}}' to provision"
restart_hint = "LSP auto-started for {{root}}. If the env is wrong, run 'lsp start file={{path}} env=<dotenv>' to restart."

# ── Error message templates ({{placeholder}} substituted at runtime) ──
[errors]
aborted = "Aborted before start."
not_found = "Not found: {{path}}"
not_a_file = "Not a file: {{path}}"
file_too_large = "{{path}} is {{size}}B (limit {{limit}}B) — too large to load. Use sh: `rg` to locate, `sed -n 'M,Np'` to read a range."
cannot_read = "Cannot read {{path}}: {{reason}}"
create_requires_text = "write requires file_text."
file_exists = "{{path}} already exists — use `edit` to modify it."
create_failed = "Could not create {{path}}: {{reason}}"
edit_requires_instruction = "edit requires an instruction."
no_editor_model = "editor: no editor model (no editor config and no main model)."
invalid_chain_regex = '[editor] chain rule {{i}}: invalid regex "{{pattern}}"; skipping.'
configured_unavailable = '[editor] configured editor.model "{{model}}" not available/authed; falling back to chain.'
viewer_timeout = "Viewer subagent timed out after {{ms}}ms. Consider fewer query statements & use concrete keywords."
editor_timeout = "Editor subagent timed out after {{ms}}ms. Consider reducing scope & increase specificity."
editor_cancelled = "Editor subagent cancelled the edit (edit-complete cancel=true)."
editor_truncated = "Editor subagent never called edit-complete (output truncated). Re-run the edit."
viewer_truncated = "Viewer subagent never called view-complete (output truncated). Re-run the read."
viewer_bad_output = "view-complete returned malformed ranges (not a JSON array of {start, end} objects).\nOutput: {{tail}}"
write_failed = "Could not write {{path}}: {{reason}}"
spawn_not_found = "pi binary not found on PATH: {{reason}}"
apply_no_blocks = "edit-complete was called with no edits."
apply_not_found = "Edit {{i}}: oldText not found in file. It must match exactly (whitespace/indentation)."
apply_not_found_fuzzy = "Edit {{i}}: oldText not found. Exact match and fuzzy fallback (uniform-indent tolerance + `...` elision) both missed."
apply_not_unique = "Edit {{i}}: oldText is not unique ({{n}} matches). Add more surrounding context."
apply_empty_with_others = "Empty oldText (whole-file rewrite) cannot coexist with other edits."
apply_overlap = "Edit {{i}} overlaps edit {{j}}. Merge or separate them."

# ── Transcript (persisted subagent log) labels ──
[transcript]
title = "# editor {{role}} subagent"
section_system = "## System Prompt"
section_user = "## User"
section_completion = "## Completion"
section_stderr = "## stderr"

# ── Injected into the main system prompt by the cpi system-prompt transform (idempotent; wrapped in markers by index.ts) ──
[system_prompt]
transcript_block = '''
Each read/write/edit result includes an `id` = short-sha of its args (command, path, plus query/instruction/file_text as applicable) — `read` results show it in the trailing `id:` footer (after a `---` separator); `edit`/`write` results carry it in the `<id>` field.
For `read` with a query and `edit`, the subagent transcript is persisted at {{dir}}/<id>.md.
'''


# ── Completion tools for the Viewer/Editor subagents (registered by
#    extensions/llm-editor/completion.ts in the child, role-gated by
#    PI_SUBAGENT_ROLE). edit-complete mirrors pi's default multi-search-replace
#    `edit` tool plus an optional cancel:bool; the subagent's tool does not write
#    files — it hands edits back to the parent, which applies them with cpi's own
#    atomic apply engine. Plain text (no HTML escaping). ──
[completion.view_complete]
description = "Return the relevant line ranges from the file and end your turn. Call this exactly once with `ranges` = a JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed). Do not print the ranges as text."
prompt_snippet = "Return relevant line ranges"
guidelines = [
	"Output ONLY by calling this tool — never print the ranges as text.",
	"`ranges` is a JSON array of objects, each with numeric `start` and `end` fields, 1-indexed and inclusive.",
	"Each range must include complete logical blocks with a few lines of context before and after.",
	"Sort ranges by start line; merge overlapping or adjacent ranges.",
	"If nothing is relevant, call with `ranges = []`.",
	"Call this tool exactly once; this ends your turn.",
]

[completion.edit_complete]
description = "Return the edits to apply to the file and end your turn. `edits` is an array of exact text replacements; each edits[].oldText must match a unique, non-overlapping region of the ORIGINAL file and edits[].newText is its replacement. To rewrite the entire file, use one edit with oldText empty and newText as the new full content. Set cancel=true to abort without applying anything."
prompt_snippet = "Return file edits as exact text replacements"
guidelines = [
	"Each edits[].oldText must match the original file EXACTLY, including whitespace and indentation.",
	"Each edits[].oldText must be unique in the file; if there are multiple matches, include more surrounding context.",
	"edits[].oldText values are matched against the original file, not after earlier edits. Do not emit overlapping or nested edits; merge nearby changes into one edit.",
	"Keep edits[].oldText as small as possible while still being unique.",
	"To rewrite the entire file, emit one edit with oldText empty (\"\") and newText as the full new content.",
	"Set cancel=true to abort the edit without applying anything. Otherwise leave `cancel` unset (defaults to false).",
	"Call this tool exactly once; this ends your turn. Do not print the edits as text.",
]

[completion.schema]
ranges = "JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed), relevant to the query."
range_start = "Start line of this range, 1-indexed and inclusive."
range_end = "End line of this range, 1-indexed and inclusive."
edits = "One or more targeted replacements. Each edit is matched against the original file, not incrementally. Do not include overlapping or nested edits; merge nearby changes into one edit instead."
oldText = "Exact text for one targeted replacement. It must be unique in the original file and must not overlap any other edits[].oldText in the same call."
newText = "Replacement text for this targeted edit."
cancel = "Set to true to abort the edit without applying anything. Defaults to false."
