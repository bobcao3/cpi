# Text for the editor tool and its tool-less subagents.

# ── System prompts for the Viewer/Editor subagents ──
[system]
viewer = '''
You are an expert code analyzer. Your task is to identify line ranges in a file
that are relevant to a given query.

You will be given:
1. A file with numbered lines in the format: LINE_NUMBER|LINE_CONTENT
2. A query describing what the user is looking for

Consider function/method definitions, class definitions, variable declarations,
imports, comments, and any code blocks that implement functionality related to
the query.

OUTPUT: return only a JSON object with `one_line_summary` (single-line string
describing file content, not the query) and `ranges` (array of objects with
integer `start` and `end` inclusive, 1-indexed). No prose or Markdown fences.

Example: {"one_line_summary":"Defines authentication checks and token refresh","ranges":[{"start":10,"end":25},{"start":45,"end":60}]}

RULES:
1. `ranges` is a JSON array of {"start": start_line, "end": end_line} objects,
  1-indexed and inclusive.
2. Each range must include complete logical blocks (do not split functions/
  classes).
3. Include a few lines of context before and after each relevant section.
4. If nothing is relevant, call with `ranges = []` and summarize what the file contains.
5. Sort ranges by start line; merge overlapping or adjacent ranges.
6. Do not include entire files unless the query asks for everything.
7. Output exactly one JSON object and end your turn.

Example 1 - Finding a specific function:
Query: "Where is the calculate_total function defined?"
{"one_line_summary":"Defines calculate_total","ranges":[{"start":15,"end":28}]}

Example 2 - Finding multiple related sections:
Query: "How is user authentication handled?"
{"one_line_summary":"Implements authentication and sessions","ranges":[{"start":5,"end":8},{"start":23,"end":45},{"start":102,"end":130}]}

Example 3 - Nothing relevant found:
Query: "Where is the database connection configured?"
{"one_line_summary":"File defines application routes and middleware","ranges":[]}
'''
editor = '''
You are an expert code editor. Analyze the numbered file and return the
requested changes as one direct unified-diff envelope. Output only this format,
with one or more hunks inside and no prose or Markdown fences:

{{open}}
@@
 exact context
-old text
+new text
{{close}}

1. Interpreting the instruction:

The file is the source of truth. If the instruction provides exact quoted text,
apply that exact change. Otherwise, its wording may be fuzzy; locate the
intended region in the file and work from what is actually there. Where the
instruction and file disagree, the file wins.

The file is shown with per-line prefix of `LINE_NUMBER|`, do not emit this into
the patch body.

When multiple edits satisfy the instruction, preserve unmentioned code and
choose the smallest faithful change.

If the instruction requires novel implementation that is not clearly specified,
cancel the edit by outputting exactly `*** EDIT CANCELED ***`.

2. Formatting the diff:

We use a single-file diff format with optional Codex-style anchors.
- Unchanged context: prefix one space
- Removed lines: prefix one `-`
- Added lines: prefix one `+`

All hunks refer to the original file and must not overlap.

Hunk headers:
- Hunk coordinates and counts may be approximate; the applier uses the hunk body
  as the source of truth and can relocate a uniquely matching hunk.
- A bare `@@` header is also accepted.
- `@@ exact source line` seeks that line before matching the hunk. Context-only
  hunks similarly anchor subsequent hunks to lines after their matched context.

Hunk body:
- Include enough unchanged or removed source context to identify the intended
  location.
- At least one hunk must add or remove a line. Unnumbered anchors must match uniquely;
  subsequent hunks must occur after them in source order.
- Use `\ No newline at end of file` only when changing final-newline state. Put
  every hunk inside the single {{open}} / {{close}} envelope and output nothing
  outside it.

---
'''

editor_fuzzy = '''
The applier can relocate a uniquely matching hunk and tolerate small whitespace
drift; source rows should otherwise follow the file.
'''

[tasks]
viewer = '''
{{content}}

Query: {{query}}

Respond with only a JSON object containing `one_line_summary` and `ranges` relevant to the query.
'''
editor = '''
{{content}}

Instruction: {{instruction}}
'''
editor_correction = '''
Validation rejected your previous direct diff:
{{failure}}

The file is unchanged. The original numbered file, instruction, and response
remain in the conversation. Do not restate or ask for them. Output only one
corrected {{open}} / {{close}} envelope with no prose.
'''
# ── Tool metadata shown to the main agent (one tool per command) ──
[tool.read]
description = "Read files and directories. On a directory, lists a non-hidden 2-level tree. On a file with a query, a Viewer subagent returns only the relevant line ranges (AI-filtered) with line numbers; without a query, a plain full-file read (no line numbers). Prefer this over sh for reading."
prompt_snippet = "Read files/dirs (AI-filtered)"
guidelines = [
	"`read` is for file and directory reads; prefer it over sh for reading (use sh for git, build, test, search, process control).",
	"`read`: pass `query` to receive only the relevant line ranges (AI-filtered, with line numbers) instead of the whole file — less context, less noise.",
	"{{#vision}}`read` on an image file (jpg/png/gif/webp/avif) shows the image to the agent, never cat/sed/base64 images.{{/vision}}",
]

[tool.edit]
description = "Edit an existing file via a natural-language instruction. An Editor subagent emits bounded single-file unified-diff hunks which the tool matches and applies in-house, atomically and with a whitespace-fuzzy fallback. Race-free per-path: concurrent same-path edits serialize."
prompt_snippet = "Edit files via natural-language instruction"
guidelines = [
	"`edit` takes a natural-language `instruction` naming the function/class/method to change; the subagent emits unified-diff hunks. Be specific: 'In MyClass.my_method, change X to Y' beats 'fix the bug'.",
	"`edit`: decompose edit tasks into concrete actions, editor subagent will refuse creative synthesis work",
	"`edit` subagent guarantees clean formatting but does not guarantee logicical correctness, you are responsible for logically correct instructions.",
	"`edit` cannot create a new file; use `write` for that.",
]

[tool.apply_patch]
description = """
Apply single-file diff hunks atomically. Headers: `@@`, `@@ exact source line`, or `@@ -OLD,COUNT +NEW,COUNT @@`. Prefix context with a space, removals with -, additions with +.
Context-only hunks anchor subsequent hunks after their matched lines; unnumbered scoped matches must be unique and proceed forward. At least one hunk must change lines. Any failed hunk leaves the file unchanged.
Patch wrappers/footers and Markdown fences are unnecessary but accepted. File headers must match path. Numbered-header function labels remain decorative. File create/delete/move operations are unsupported.
"""
prompt_snippet = "Apply single-file diff hunks directly"
guidelines = [
	"Prefer `apply_patch` when you already know the exact change and have the current source; use `edit` to delegate producing the change. Re-read after a mismatch rather than guessing context.",
]

[tool.write]
description = "Write a new file. Fails if the path already exists (use apply_patch or edit to modify an existing file). Creates parent directories as needed."
prompt_snippet = "Write new files"
guidelines = [
	"`write` writes a new file from `file_text`; it fails if the path already exists — use `apply_patch` or `edit` to modify an existing file.",
	"`write` is preferred over `sh` heredocs for new files; it is atomic and shares `edit`'s per-path locking.",
]

# ── Schema field descriptions (injected into the TypeBox tool schemas) ──
[schema]
path = "Absolute path to a file or directory."
read_path = "Absolute path to a file or directory; $PI_AGENT_SRC/, $CPI_HARNESS_SRC/, and $HOME/ prefixes are also accepted."
query = "read: natural-language query for what to find; an LLM returns only the relevant line ranges with line numbers."
instruction = "edit: natural-language change description; name the function/class/method to change."
file_text = "write: full content of the new file."
patch = "Single-file unified-diff hunks against the original file. No wrapper or footer is needed."

# ── Short result/inline message strings ──
[messages]
view_no_ranges = "(no relevant ranges)"
empty_dir = "(empty)"
no_output = "(no output)"
head_more = "... ({{n}} more lines; pass a query to view relevant ranges)"
lines_omitted = "... ({{n}} lines omitted) ..."
image_read = "Read image file [{{mime}}]"
image_omitted = "Read image file [{{mime}}]\n[Image omitted: could not be resized below the inline image size limit.]"
image_unsupported = "Image file [{{mime}}]: {{path}}. The current model does not support images."
video_note = '''Video file [{{path}}]. pi has no native video content type, so it cannot be inlined. Extract frames via sh, e.g. `ffmpeg -i "{{path}}" -vf fps=1 frame_%03d.png`, then read the frames.'''

# ── LSP result-field strings (design §9; {{placeholder}} substituted via fmt) ──
[lsp]
diagnostics_none = "none"
install_failed = "run 'lsp start file={{path}}' to provision"
restart_hint = "LSP auto-started for {{root}}. If the env is wrong, run 'lsp start file={{path}} env=<dotenv>' to restart."

# ── Error message templates ({{placeholder}} substituted at runtime) ──
[errors]
aborted = "Aborted."
not_found = "Not found: {{path}}"
not_a_file = "Not a file: {{path}}"
file_too_large = "{{path}} is {{size}}B (limit {{limit}}B) — too large to load. Use sh: `rg` to locate, `sed -n 'M,Np'` to read a range."
cannot_read = "Cannot read {{path}}: {{reason}}"
create_requires_text = "write requires file_text."
file_exists = "{{path}} already exists — use `apply_patch` or `edit` to modify it."
create_failed = "Could not create {{path}}: {{reason}}"
edit_requires_instruction = "edit requires an instruction."
no_editor_model = "editor: no editor model (no editor config and no main model)."
invalid_chain_regex = '[editor] chain rule {{i}}: invalid regex "{{pattern}}"; skipping.'
configured_unavailable = '[editor] configured editor.model "{{model}}" not available/authed; falling back to chain.'
chain_zero_width = '[editor] chain rule {{i}}: regex "{{pattern}}" matches an empty string, which would prepend "{{replace}}" instead of replacing; skipping.'
chain_malformed_selector = '[editor] chain rule {{i}}: rewrite of "{{pattern}}" produced malformed selector "{{selector}}"; skipping.'
chain_no_match = '[editor] no chain rule matched "{{selector}}"; using main model {{main}}.'
provider_fallback = '[editor] {{requested}} not found/authed; using id-only match {{resolved}}.'
viewer_timeout = "Viewer subagent timed out after {{ms}}ms. Consider fewer query statements & use concrete keywords."
editor_timeout = "Editor subagent timed out after {{ms}}ms. Consider reducing scope & increase specificity."
no_change = "The edit produced no change to the file. Re-check the change against the current file content."
editor_corrections_exhausted = "Editor correction limit reached after {{turns}} correction turns. Last validation error: {{failure}}"
direct_output_overflow = "Editor direct output exceeded the bounded response-size limit."
direct_too_large = "The direct diff exceeds the bounded patch-size limit."
direct_missing_envelope = "Direct output must contain one `{{open}}` / `{{close}}` envelope."
direct_multiple_envelopes = "Direct output contains more than one DIFF envelope."
direct_bad_envelope = "The direct DIFF envelope markers are out of order."
direct_outside_text = "Direct output contains text outside the DIFF envelope."
direct_empty_diff = "The direct DIFF envelope is empty."
direct_editor_cancelled = "Editor cancelled: the instruction requires open-ended implementation choices. Use write or provide an exact replacement."
viewer_truncated = "Viewer response exceeded the output-size limit. Re-run with a narrower query."
viewer_bad_output = "Viewer returned invalid JSON or invalid one_line_summary/ranges.\nOutput: {{tail}}"
write_failed = "Could not write {{path}}: {{reason}}"
subagent_start_failed = "Could not start subagent worker: {{reason}}"
apply_bad_framing = "Diff block {{i}}, patch line {{line}}: unsupported framing or extra file section. Supply hunks for one existing file; only outer patch wrappers, Markdown fences, and matching file headers are accepted. File create/delete/move operations are unsupported."
apply_bad_target = "Diff block {{i}}, patch line {{line}}: file headers must name the target path on both sides. Do not include another file, a rename, or /dev/null."
apply_no_diffs = "No diff hunks were supplied."
apply_too_many = "Diff block {{i}} exceeds the bounded hunk-count limit."
apply_too_large = "Diff block {{i}} exceeds the bounded patch-size limit."
apply_bad_block = "Diff block {{i}} is not a non-empty unified-diff string."
apply_bad_header = "Diff block {{i}}, patch line {{line}}: use @@, @@ exact source line, or numbered @@ -OLD,COUNT +NEW,COUNT @@."
apply_no_changes = "Diff block {{i}} has no changes (or an empty unscoped hunk at patch line {{line}}). Include at least one + or - row. No changes were applied."
apply_bad_count = "Diff block {{i}} declares source lines but supplies none. Include the source context or use a zero-count header for an insertion."
apply_bad_newline = "Diff block {{i}} has an invalid `No newline at end of file` marker or EOF location."
apply_work_limit = "Diff block {{i}} exceeded the bounded matching-work limit. Add accurate line coordinates and more specific context."
apply_bad_anchor = "Diff block {{i}} is a pure insertion without a usable position. Give real header coordinates, a preceding context-only anchor, or a `@@ exact source line` header."
apply_not_found = "Diff block {{i}} does not match the file at its line anchor or at one unambiguous exact relocation. Re-read the numbered file and copy its context and removed rows exactly."
apply_not_found_fuzzy = "Diff block {{i}} matched nothing in the file, exactly or with the whitespace-fuzzy fallback. Its context or removed rows differ from the real file lines — re-read the numbered file and copy them exactly rather than from the instruction."
apply_ambiguous = "Diff block {{i}} has multiple possible application locations. Add context or correct its line header."
apply_overlap = "Diff block {{i}} conflicts with diff block {{j}}. Separate or merge the changed regions."

# ── Transcript (persisted subagent log) labels ──
[transcript]
title = "# {{role}} {{title}}"
section_system = "## System Prompt"
section_user = "## User"
section_completion = "## Completion"
section_completion_turn = "## Completion {{turn}}"
section_correction_turn = "## Correction {{turn}}"
section_stderr = "## stderr"

