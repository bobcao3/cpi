create_requires_text = "write requires file_text."
file_exists = "{{path}} already exists — use `edit` to modify it."
create_failed = "Could not create {{path}}: {{reason}}"
edit_requires_instruction = "edit requires an instruction."
no_editor_model = "editor: no editor model (no editor config and no main model)."
invalid_chain_regex = '[editor] chain rule {{i}}: invalid regex "{{pattern}}"; skipping.'
configured_unavailable = '[editor] configured editor.model "{{model}}" not available/authed; falling back to chain.'
viewer_timeout = "Viewer subagent timed out after {{ms}}ms. Consider fewer query statements & use concrete keywords."
editor_timeout = "Editor subagent timed out after {{ms}}ms. Consider reducing scope & increase specificity."
editor_cancelled = "Editor subagent cancelled the edit (edit-complete cancel=true)."
editor_truncated = "Editor subagent never called edit-complete (output truncated). Re-run the edit."
viewer_truncated = "Viewer subagent never called view-complete (output truncated). Re-run the read."
viewer_bad_output = "view-complete returned malformed ranges (not a JSON array of {start, end} objects).\nOutput: {{tail}}"
write_failed = "Could not write {{path}}: {{reason}}"
spawn_not_found = "pi binary not found on PATH: {{reason}}"
apply_no_diffs = "edit-complete was called without any diff hunks."
apply_too_many = "Diff block {{i}} exceeds the bounded hunk-count limit."
apply_too_large = "Diff block {{i}} exceeds the bounded patch-size limit."
apply_bad_block = "Diff block {{i}} is not a non-empty unified-diff string."
apply_bad_header = "Diff block {{i}} line {{line}} must start with a valid `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@` header."
apply_multiple_hunks = "Diff block {{i}} line {{line}} starts another hunk. Put each hunk in its own `diffs` array element."
apply_bad_prefix = "Diff block {{i}} line {{line}} must begin with a context space, `-`, or `+`."
apply_no_changes = "Diff block {{i}} contains no added or removed lines."
apply_bad_count = "Diff block {{i}} header counts do not match its source/target body lines."
apply_bad_elision = "Diff block {{i}} has an invalid `...` context elision. Elisions must occur singly between explicit source regions."
apply_bad_newline = "Diff block {{i}} has an invalid `No newline at end of file` marker or EOF location."
apply_work_limit = "Diff block {{i}} exceeded the bounded matching-work limit. Add accurate line coordinates and more specific context."
apply_bad_anchor = "Diff block {{i}} has an out-of-range insertion anchor."
apply_not_found = "Diff block {{i}} does not match the file at its line anchor or at one unambiguous exact relocation."
apply_not_found_fuzzy = "Diff block {{i}} did not match exactly or with the whitespace-fuzzy/`...` fallback."
apply_ambiguous = "Diff block {{i}} has multiple possible application locations. Add context or correct its line header."
apply_overlap = "Diff block {{i}} conflicts with diff block {{j}}. Separate or merge the changed regions."

# ── Transcript (persisted subagent log) labels ──
[transcript]
title = "# editor {{role}} subagent"
section_system = "## System Prompt"
section_user = "## User"
section_completion = "## Completion"
section_stderr = "## stderr"

# ── Completion tools for the Viewer/Editor subagents (registered by
#    extensions/llm-editor/completion.ts in the child, role-gated by
#    PI_SUBAGENT_ROLE). edit-complete hands bounded unified-diff hunks to the
#    parent, which parses, matches, and applies all hunks with cpi's in-house
#    atomic engine. Plain text (no HTML escaping). ──
[completion.view_complete]
description = "Return the relevant line ranges from the file and end your turn. Call this exactly once with `ranges` = a JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed). Do not print the ranges as text."
prompt_snippet = "Return relevant line ranges"
guidelines = [
	"Output ONLY by calling this tool — never print the ranges as text.",
	"`ranges` is a JSON array of objects, each with numeric `start` and `end` fields, 1-indexed and inclusive.",
	"Each range must include complete logical blocks with a few lines of context before and after.",
	"Sort ranges by start line; merge overlapping or adjacent ranges.",
	"If nothing is relevant, call with `ranges = []`.",
	"Call this tool exactly once; this ends your turn.",
]

[completion.edit_complete]
description = "Return one or more single-file unified-diff hunks in `diffs` and end your turn. Each array element contains exactly one hunk for the original numbered file. Set cancel=true to abort without applying anything."
prompt_snippet = "Return file edits as unified-diff hunks"
guidelines = [
	"Each `diffs` element starts with `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@` and contains exactly one hunk.",
	"Prefix context with one space, removals with `-`, and additions with `+`; do not include file headers, fences, or prose.",
	"Line-number annotations identify OLD_START but are not file content. Never copy the annotation prefix into hunk lines.",
	"All context/removal rows refer to the original supplied file. Use separate array elements for separated, non-overlapping changes.",
	"A context row containing only `...` may preserve an omitted unchanged span between explicit regions.",
	"Use the standard `\\ No newline at end of file` marker only to change final-newline state.",
	"Set cancel=true and omit `diffs` to abort without applying anything. Otherwise leave `cancel` unset.",
	"Call this tool exactly once; this ends your turn. Do not print the diffs as text.",
]

[completion.schema]
ranges = "JSON array of line-range objects, each with numeric `start` and `end` fields (inclusive, 1-indexed), relevant to the query."
range_start = "Start line of this range, 1-indexed and inclusive."
range_end = "End line of this range, 1-indexed and inclusive."
diffs = "One or more bounded single-file unified-diff hunks. Each array element contains exactly one hunk against the original supplied file. Required unless cancel is true."
diff = "One unified-diff hunk beginning with an `@@ -OLD_START,OLD_COUNT +NEW_START,NEW_COUNT @@` header, followed by space/plus/minus-prefixed body lines."
cancel = "Set to true to abort the edit without applying anything. Defaults to false."
