# Model-facing text for the shell tools.

# ── Tool metadata shown to the main agent ──
[sh]
description = "Run a command via `{{shell_invocation}}` ({{shell_name}}). Stateless: no env/cwd persistence. If the command runs longer than `waitfor`, sh backgrounds it and returns an id for signalling. Maximum waitfor is {{max_waitfor}}s. Codemode calls return structured results: check is_error and status, read output for the bounded command preview, and use full_output_path for the complete output. Non-zero exits and blocked commands return is_error=true; execution exceptions still reject."
prompt_snippet = "Run shell commands"

[sh_signal]
description = "Signal a background shell command by its PID (sh-returned). {{#windows}}On Windows, this terminates the background process tree; POSIX signal names are treated as forced termination.{{/windows}}{{^windows}}Send SIGKILL to terminate background shell process-group.{{/windows}}"
prompt_snippet = "Signal background shell commands"

[sh_background_ps]
description = "List active background shells and repeat_until monitors."
prompt_snippet = "List active background jobs"

[sh_detach]
description = "Release a background shell (by sh-returned PID) to run on its own, untracked: it survives this pi process, no completion notification fires, and sh_signal/killAll will not touch it. Output keeps draining to its log file. The child never receives SIGPIPE because pi never held its pipe (ghostmux does)."
prompt_snippet = "Detach background shells to run untracked"

[schema.sh]
description = "Short description of what this command is doing (a few words)"
waitfor = "Seconds to wait before backgrounding (default {{max_waitfor}}, max {{max_waitfor}}; >{{max_waitfor}} errors)"
command = "Command to run"
env = "Dotenv merged into sh env; dotenv wins for command variables, while cpi session/runtime routing variables refresh from the current session"

is_pty = "Allocate a pseudoterminal for interactive terminal applications; default false preserves pipe semantics. Use ghostmux send-input for CLI input."

[schema.sh_signal]
id = "Background shell PID (as returned by sh)"
signal = "Signal name/number (default SIGINT; {{#windows}}on Windows, any signal request forcibly terminates the entire background process tree; POSIX signal names are treated as forced termination{{/windows}}{{^windows}}SIGKILL to terminate{{/windows}})"

[schema.sh_detach]
id = "Background shell PID (as returned by sh)"

[results.sh_signal]
windows_terminated = "Background {{id}} process tree terminated (requested {{signal}})."
posix_killed = "Background {{id}} terminated (SIGKILL)."
posix_sent = "Sent {{signal}} to {{id}}."

[results.sh]
aborted = "Aborted before start."

[completion]
repeat-breach = "Repeat monitor {{id}} breached on exit {{code}} (shell command time exceeded repeat interval)"
repeat-stopped = "Repeat monitor {{id}} stopped on exit {{code}}"
shell-complete = "Shell {{shell_label}} completed on exit {{code}}"
shell-failed = "Shell {{shell_label}} command failed on exit {{code}}"
summary = "{{base}}; log {{path}}{{#has_range}} lines {{start}}..{{end}}{{/has_range}}"

[shutdown]
summary = "Session shutdown interrupted background {{kind}} {{id}}{{#describe}} · {{describe}}{{/describe}}."
guidance = "cpi stopped tracking this background action during session shutdown and requested termination of any running command. The final exit status is unknown. Do not assume the command completed or stopped. Check the log and command side effects before restarting."

# ── promptGuidelines ──
[guidelines]
sh = [
  "Use is_pty=true for interactive terminal applications. Send input with ghostmux send-input --uid UID --text TEXT; sh has no stdin tool parameter.",
  "Shell results include UID and socketPath. Select the target daemon with ghostmux -S SOCKET COMMAND. The shell environment includes CPI_GHOSTMUX_SOCKET and ghostmux on PATH; pass the socket explicitly with -S.",
  "Read rendered terminal text with ghostmux -S SOCKET capture-pane --uid UID --history --join. Read raw bytes with ghostmux -S SOCKET read-output --uid UID --offset N --limit N. Save a live PTY image with ghostmux -S SOCKET screenshot --uid UID --output PATH. Completed sessions no longer retain terminal state; read their durable log instead.",
  "The returned log path contains the recorded raw output, including terminal escape sequences. Replay completed PTY logs with ghostmux --input LOG --text capture.txt --history --join --png screen.png; supply the terminal's --cols and --rows when replaying a non-default geometry.",
  "Each sh call = fresh `{{shell_invocation}}` ({{shell_name}}). No session reuse; env/cwd/shell state don't persist. Use `env-capture` to capture the current environment as a dotenv file that you can load in later `sh` sessions.",
  "For sh & sh_repeat_until, a short `description` parameter is required (a few words explaining the command's purpose).",
  "For sh tool, the maximum legal `waitfor` time is {{max_waitfor}}s; any longer the command will be rejected.",
  "Signal a background shell via sh_signal with its PID; send SIGKILL to terminate.",
  "A completion notification will fire once a background shell finishes and returns control to agent.",
  "Avoid polling or busy waiting: do not set up repeated `alarm`s to poll a backgrounded shell (a completion notification fires on its own), and try to avoid writing `sleep N && ...` commands; use the `alarm` tool instead for scheduled wake-ups.",
  "If a background shell completes and no follow-up is needed, feel free to end the turn.",
  "{{#fd}}Search files with the faster `$ fd` command not `$ find`: fd [OPTS] [-H] [-I] [pattern] [path]...{{/fd}}",
  "{{#rg}}Search content with the faster `$ rg` command not `$ grep`: rg [OPTS] [--hidden] [--no-ignore] PATTERN [path]...{{/rg}}",
  "If an LSP session is running, `sh` tool editing commands will trigger LSP auto-lint.",
]
sh_signal = [
  "{{^windows}}sh_signal defaults to SIGINT, and signal is always delivered to the whole process group.{{/windows}}",
  "{{^windows}}Do not run `kill` via sh on background PIDs; use `sh_signal` instead.{{/windows}}",
  "{{^windows}}SIGKILL terminates the process group and suppresses the completion notice; no completion notification will fire for that shell, so do not call wait_any expecting one; any other signal (SIGINT, SIGTERM, …) may be caught or ignored, so the process is not guaranteed to stop. Its completion notification will still fire when the process eventually exits; call wait_any to yield until then.{{/windows}}",
  "{{#windows}}Every signal request forcibly terminates the entire background process tree and suppresses the completion notice.{{/windows}}",
  "{{#windows}}Windows does not provide POSIX signal delivery.{{/windows}}"
]
sh_detach = [
  "After detach, the PID is gone from sh_background_ps and unreachable by sh_signal, no completion notification fires afterward, but the process will continue to run as if it's in nohup",
  "For a process you know that must outlive current session (such as a service or web server), you should invoke sh_detach after backgrounding to make it a detached daemon.",
  "Never use sh_detach for the subagent launcher: detaching only its RPC client cannot detach the root-owned Worker thread, and root pi shutdown cancels the agent.",
  "Detaching a background shell is basically equivalent to runnint it in a nohup / tmux."
]
sh_background_ps = [
  "Use sh_background_ps to list running background shells and monitors.",
]
